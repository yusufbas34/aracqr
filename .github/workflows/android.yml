name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/release/app-release.apk arac-qr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arac-qr-apk
          path: arac-qr.apk

      # Sabit indirme bağlantısı: https://github.com/<sahip>/<repo>/releases/download/apk-son/arac-qr.apk
      - name: Son sürüm bağlantısını güncelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son arac-qr.apk \
            --title "Araç QR Android uygulaması (son sürüm)" \
            --notes "Derleme ${{ github.run_number }} · ${{ github.sha }}. Telefona kurmak için arac-qr.apk dosyasını indirip açın; ilk kurulumda 'bilinmeyen kaynaklara izin ver' istenir." \
            --target "${{ github.sha }}"
