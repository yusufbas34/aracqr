<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;

// ---------------------------------------------------------------- yardımcılar
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function rpc(fn, args) {
  const headers = {"Content-Type": "application/json", apikey: SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY; // eski tip anon key
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method: "POST", headers, body: JSON.stringify(args)});
  const data = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(data?.message || r.statusText); e.status = r.status; throw e; }
  return data;
}

function normalizePhone(raw) {
  let s = String(raw || "").replace(/[^\d+]/g, "");
  if (s.startsWith("00")) s = "+" + s.slice(2);
  if (s.startsWith("+")) return (s.length - 1 >= 8 && s.length - 1 <= 15) ? s : null;
  if (s.startsWith("90") && s.length === 12) return "+" + s;
  if (s.startsWith("0") && s.length === 11) return "+9" + s;
  if (s.startsWith("5") && s.length === 10) return "+90" + s;
  return null;
}

function prettyPhone(p) {
  if (p && p.startsWith("+90") && p.length === 13) {
    const n = p.slice(3);
    return `0${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6,8)} ${n.slice(8)}`;
  }
  return p || "";
}

const plate = code => `<div class="plate"><div class="band">TR</div><div class="txt">${esc(code)}</div></div>`;
const tagLink = code => `${BASE}?k=${encodeURIComponent(code)}`;

function show(html, wide = false) { app.className = wide === true ? "wide" : wide || ""; app.innerHTML = html; }

// ---------------------------------------------------------------- ekranlar
function showForm(code, {title, intro, button, overwrite}, error = "", phoneVal = "") {
  show(`
    ${plate(code)}
    <h1>${esc(title)}</h1>
    <p>${esc(intro)}</p>
    ${error ? `<div class="msg err">${esc(error)}</div>` : ""}
    <form id="f" novalidate>
      <label for="phone">Telefon numarası</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" value="${esc(phoneVal)}" required>
      <label for="pin">Karttaki PIN</label>
      <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="6 haneli" autocomplete="off" required>
      <button class="btn" type="submit">${esc(button)}</button>
    </form>`);
  const opts = {title, intro, button, overwrite};
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const raw = document.getElementById("phone").value;
    const pin = document.getElementById("pin").value.trim();
    const phone = normalizePhone(raw);
    if (!phone) return showForm(code, opts, "Numara geçersiz. Örnek: 0532 123 45 67", raw);
    if (!/^\d{6}$/.test(pin)) return showForm(code, opts, "PIN 6 haneli olmalı.", raw);
    ev.submitter && (ev.submitter.disabled = true);
    try {
      const res = await rpc("tag_save", {p_code: code, p_pin: pin, p_phone: phone, p_overwrite: overwrite});
      if (res.ok) return showSaved(code, res.phone);
      const errors = {
        bad_pin: "PIN hatalı. Etiketle birlikte gelen karttaki 6 haneli PIN'i girin.",
        locked: `Çok fazla yanlış deneme. ${res.minutes || 15} dakika sonra tekrar deneyin.`,
        bad_phone: "Numara geçersiz. Örnek: 0532 123 45 67",
        not_found: "Bu etiket bulunamadı.",
      };
      if (res.error === "already") return route(); // biri az önce kaydetmiş
      showForm(code, opts, errors[res.error] || "Kaydedilemedi, tekrar deneyin.", raw);
    } catch (e) {
      showForm(code, opts, "Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.", raw);
    }
  });
}

const CLAIM = {title: "Bu etiketi numaranıza bağlayın", button: "Numarayı kaydet", overwrite: false,
  intro: "Etiket henüz kullanılmıyor. Numaranızı ve etiketle gelen karttaki PIN'i girin. Bundan sonra bu QR'ı okutan herkes sizi arayabilecek."};
const CHANGE = {title: "Numarayı değiştir", button: "Yeni numarayı kaydet", overwrite: true,
  intro: "Yeni numarayı ve etiketin PIN'ini girin."};

function showCall(code, phone) {
  show(`
    ${plate(code)}

function confetti() {
  const colors = ["#0a3a9e", "#ffd400", "#0c7a43", "#d9426b", "#5ef2ff", "#f3a25a"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti noprint";
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};` +
      `animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s;border-radius:${i % 3 ? 2 : 50}px`;
    document.body.append(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// ---------------------------------------------------------------- PDF
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = Object.assign(document.createElement("script"), {src, onload: ok, onerror: () => fail(new Error("Kütüphane yüklenemedi"))});
    document.head.append(el);
  });
}

async function loadPdfLibs() {
  await Promise.all([
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"),
  ]);
}

const PX = 25.4 / 96; // CSS px -> mm

async function snap(el) {
  const r = el.getBoundingClientRect();
  const canvas = await html2canvas(el, {scale: 5, backgroundColor: "#ffffff", logging: false});
  return {img: canvas.toDataURL("image/png"), w: r.width * PX, h: r.height * PX};
}

// A4: etiketleri gerçek boyutlarıyla sayfaya dizer. Tek: her sticker / PIN kartı kendi ölçüsünde ayrı sayfa (matbaa, etiket yazıcısı).
async function savePdf(codes) {
  await loadPdfLibs();
  await document.fonts?.ready;
  const {jsPDF} = window.jspdf;
  const tags = codes.map(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)).filter(Boolean);
  let pdf;
  if (paper === "tek") {
    const {w, h} = dims(stickerSize), fmt = [w, h];
    for (const tag of tags) {
      for (const el of tag.querySelectorAll(".sticker, .pin")) {
        if (!el.offsetParent) continue; // seçili modda gizli
        const s = await snap(el);
        if (pdf) pdf.addPage(fmt, "portrait"); else pdf = new jsPDF({unit: "mm", format: fmt, orientation: "portrait"});
        pdf.addImage(s.img, "PNG", (w - s.w) / 2, el.classList.contains("pin") ? 0 : (h - s.h) / 2, s.w, s.h);
      }
    }
  } else {
    pdf = new jsPDF({unit: "mm", format: "a4"});
    const {W, H, M, G} = A4;
    let x = M, y = M, rowH = 0;
    for (const tag of tags) {
      const s = await snap(tag.querySelector(".block"));
      if (x + s.w > W - M + .1) { x = M; y += rowH + G; rowH = 0; }
      if (y + s.h > H - M + .1) { pdf.addPage(); x = M; y = M; rowH = 0; }
      pdf.addImage(s.img, "PNG", x, y, s.w, s.h);
      x += s.w + G; rowH = Math.max(rowH, s.h);
    }
  }
  if (!pdf) throw new Error("Kaydedilecek etiket yok");
  const name = codes.length === 1 ? `etiket-${codes[0]}` : `etiketler-${codes.length}`;
  pdf.save(`${name}-${stickerSize}mm.pdf`);
}

const A4 = {W: 210, H: 297, M: 10, G: 3};
const dims = size => { const [w, h] = size.split("x").map(Number); return {w, h, k: Math.min(w / 60, h / 90)}; };
const perA4 = ({w, h}) => Math.floor((A4.W - 2 * A4.M + A4.G) / (w + A4.G)) * Math.floor((A4.H - 2 * A4.M + A4.G) / (h + A4.G));

function pref(key, fallback, allowed) {
  try { const v = localStorage.getItem("aracqr-" + key); if (v !== null && (!allowed || allowed.includes(v))) return v; } catch (e) {}
  return fallback;
}
function savePref(key, value) { try { localStorage.setItem("aracqr-" + key, value); } catch (e) {} }

function applySize() {
  const {w, h, k} = dims(stickerSize), grid = document.querySelector(".grid");
  if (grid) {
    grid.style.cssText = `--w:${w}mm;--h:${h}mm;--k:${k}`;
    grid.className = ["grid", printMode, paper === "tek" ? "tek" : "", k < .75 ? "small-size" : ""].join(" ").trim();
  }
  let st = document.getElementById("pagestyle");
  if (!st) { st = document.createElement("style"); st.id = "pagestyle"; document.head.append(st); }
  st.textContent = paper === "tek" ? `@page{size:${w}mm ${h}mm;margin:0}` : `@page{size:A4;margin:${A4.M}mm}`;
}

// Yazdırır ya da PDF kaydeder; ardından verilmemiş olanları verildi olarak işaretlemeyi önerir.
async function deliver(codes, how, givenSupported) {
  if (!codes.length) return;
  if (how === "pdf") {
    toast("PDF hazırlanıyor…", 60000);
    try { await savePdf(codes); toast("PDF kaydedildi."); }
    catch (e) { document.querySelector(".toast")?.remove(); return adminError("PDF oluşturulamadı: " + e.message); }
  } else {
    document.querySelectorAll(".tag").forEach(t => t.classList.toggle("skip", !codes.includes(t.dataset.code)));
    await new Promise(done => { addEventListener("afterprint", done, {once: true}); print(); });
    document.querySelectorAll(".tag.skip").forEach(t => t.classList.remove("skip"));
  }
  const fresh = codes.filter(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)?.dataset.state === "ready");
  if (!givenSupported || !fresh.length) return;
  if (!confirm(`${fresh.length} etiket verildi olarak işaretlensin mi? Verilen etiketler bu listede bir daha görünmez.`)) return;
  try {
    await setGiven(fresh, true);
    await showAdmin();
    confetti();
    toast(fresh.length === 1 ? `${fresh[0]} yeni sahibine yolculuğa çıktı!` : `${fresh.length} etiket yeni sahiplerine yolculuğa çıktı!`);
  } catch (e) { adminError("İşaretlenemedi: " + e.message); }
}

  let rows;
  try { rows = await rpc("admin_list", {p_key: adminKey}); }
  catch (e) { return showAdminLogin(e.status ? "Şifre hatalı." : "Bağlantı hatası, tekrar deneyin."); }
  if (!Array.isArray(rows)) return showAdminLogin("Beklenmeyen yanıt, tekrar deneyin.");
  if (typeof qrcode !== "function") return showMessage("QR kütüphanesi yüklenemedi", "Sayfayı yenileyip tekrar deneyin.");
  const [given, requests] = await Promise.all([loadGiven(), loadRequests()]);
  if (adminTab === "requests") return showRequests(rows, given, requests);
  const state = r => r.phone ? "used" : given?.has(String(r.code).toUpperCase()) ? "given" : "ready";
  const count = {ready: 0, given: 0, used: 0};
  rows.forEach(r => count[state(r)]++);
  const list = rows.filter(r => view === "all" || (view === "ready") === (state(r) === "ready"));
  list.forEach(r => { designOf[r.code] ||= defaultDesign === RANDOM ? pickRandom() : defaultDesign; });
  const label = {ready: "Verilmedi", given: "Verildi, henüz numara kaydedilmedi", used: "Kayıtlı"};
  show(`
    ${tabsHtml(requests ? requests.filter(r => r.status === "yeni").length : 0)}
    <div class="bar noprint">
      <select id="view" aria-label="Hangi etiketler">
        <option value="ready">Verilecek etiketler (${count.ready})</option>
        <option value="out">Verilmiş etiketler (${count.given + count.used})</option>
        <option value="all">Tümü (${rows.length})</option>
      </select>
      <select id="mode" aria-label="Ne çıkarılsın">
        <option value="">Sticker + PIN kartı</option>
        <option value="only-sticker">Sadece stickerlar</option>
        <option value="only-pin">Sadece PIN kartları</option>
      </select>
      <select id="size" aria-label="Baskı ölçüsü">${Object.entries(SIZES).map(([k, n]) =>
        `<option value="${k}"${k === stickerSize ? " selected" : ""}>${n} · A4'e ${perA4(dims(k))}</option>`).join("")}</select>
      <select id="paper" aria-label="Kağıt">
        <option value="a4">A4 kağıda diz</option>
        <option value="tek">Her sayfaya bir etiket (matbaa / etiket yazıcısı)</option>
      </select>
      <select id="design" aria-label="Tümü için tasarım">${designOptions(defaultDesign, true)}</select>
      <button class="btn" id="dice" title="Hepsine rastgele tasarım">🎲 Karıştır</button>
      <button class="btn" id="print">Listedekileri yazdır</button>
      <button class="btn" id="pdf">Listedekileri PDF kaydet</button>
      <button class="btn" id="add">10 etiket daha üret</button>
    </div>
    ${given ? "" : setupHtml('"Verildi" takibi kurulu değil.', "verildi.sql")}
    <p class="noprint">Talep edene etiket verirken tasarımı seçip <b>Yazdır ve ver</b> ya da <b>PDF kaydet ve ver</b>'e basın; etiket verildi olarak işaretlenip bu listeden kalkar.
      Kişi QR'ı okutup numarasını ve PIN'i girdiğinde etiket o numarayı aramaya başlar.
      Yazdırırken ölçek <b>%100 / Gerçek boyut</b> olmalı. Etiket yazıcısı ya da matbaa için “Her sayfaya bir etiket”i seçin; sayfa ölçüsü sticker ölçüsü olur.</p>
    <div id="msg"></div>
    ${list.length ? "" : `<p>Bu listede etiket yok.${view === "ready" ? " Yeni etiket üretmek için “10 etiket daha üret”e basın." : ""}</p>`}
    <div class="grid">
      ${list.map(r => `
        <div class="tag" data-code="${esc(r.code)}" data-state="${state(r)}">
          <div class="block">${stickerHtml(r.code, designOf[r.code])}
            <div class="pin"><b>${esc(r.code)}</b> etiketinin PIN'i<span>${esc(r.pin)}</span><small>Numarayı kaydetmek ve değiştirmek için gerekir. Bu kartı araçta bırakmayın.</small></div>
          </div>
          <div class="state noprint">
            <div>${label[state(r)]}${r.phone ? ": " + esc(prettyPhone(r.phone)) : ""}</div>
            <select data-act="design" aria-label="${esc(r.code)} tasarımı">${designOptions(designOf[r.code], false)}</select>
            ${state(r) === "ready" ? `<button class="mini" data-act="give">Yazdır ve ver</button>
              <button class="mini alt" data-act="givepdf">PDF kaydet ve ver</button>` :
              `<button class="mini alt" data-act="pdf">PDF kaydet</button>`}
            ${state(r) === "ready" && given ? `<button class="mini ghost" data-act="mark">Sadece verildi işaretle</button>` : ""}
            ${state(r) === "given" ? `<button class="mini ghost" data-act="undo">Geri al (verilmedi)</button>` : ""}
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const $ = id => document.getElementById(id);
  const codes = list.map(r => r.code);
  $("view").value = view; $("mode").value = printMode; $("paper").value = paper;
  applySize();
  $("view").onchange = () => { view = $("view").value; showAdmin(); };
  $("mode").onchange = () => { printMode = $("mode").value; savePref("mode", printMode); applySize(); };
  $("size").onchange = () => { stickerSize = $("size").value; savePref("size", stickerSize); applySize(); };
  $("paper").onchange = () => { paper = $("paper").value; savePref("paper", paper); applySize(); };
  const redesign = (code, d) => {
    designOf[code] = d;
    const tag = document.querySelector(`.tag[data-code="${CSS.escape(code)}"]`);
    tag.querySelector(".sticker").outerHTML = stickerHtml(code, d);
    tag.querySelector('select[data-act="design"]').value = d;
  };
  $("design").onchange = () => {
    defaultDesign = $("design").value;
    savePref("design", defaultDesign);
    codes.forEach(c => redesign(c, defaultDesign === RANDOM ? pickRandom() : defaultDesign));
  };
  $("dice").onclick = () => { codes.forEach(c => redesign(c, pickRandom())); toast("Tasarımlar karıştırıldı!", 1500); };
  $("print").onclick = () => deliver(codes, "print", !!given);
  $("pdf").onclick = async ev => { ev.target.disabled = true; await deliver(codes, "pdf", !!given); ev.target.disabled = false; };
  const grid = document.querySelector(".grid");
  grid.onchange = ev => {
    if (ev.target.dataset.act === "design") redesign(ev.target.closest(".tag").dataset.code, ev.target.value);
  };
  grid.onclick = async ev => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const code = btn.closest(".tag").dataset.code, act = btn.dataset.act;
    btn.disabled = true;
    try {
      if (act === "give") return await deliver([code], "print", !!given);
      if (act === "givepdf" || act === "pdf") return await deliver([code], "pdf", !!given);
      await setGiven([code], act === "mark");
      await showAdmin();
      if (act === "mark") toast(`${code} verildi olarak işaretlendi.`);
    } catch (e) { adminError("İşlem yapılamadı: " + e.message); }
    finally { btn.disabled = false; }
  };
  $("add").onclick = async ev => {
    ev.target.disabled = true;
    try { await rpc("admin_add", {p_key: adminKey, p_count: 10}); }
    catch (e) { ev.target.disabled = false; return adminError("Etiket üretilemedi: " + e.message); }
    showAdmin();
  };
}

function requestFormHtml(error = "", v = {}) {
  const val = k => `value="${esc(v[k] || "")}"`;
  return `
    ${error ? `<div class="msg err" role="alert">${esc(error)}</div>` : ""}
    <form id="rf" novalidate>
      <div class="row2">
        <div><label for="r-first">Ad</label><input id="r-first" autocomplete="given-name" required ${val("first")}></div>
        <div><label for="r-last">Soyad</label><input id="r-last" autocomplete="family-name" required ${val("last")}></div>
      </div>
      <label for="r-email">E-posta</label>
      <input id="r-email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@mail.com" required ${val("email")}>
      <label for="r-phone">Telefon <span style="font-weight:400;color:var(--muted)">(isteğe bağlı)</span></label>
      <input id="r-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" aria-describedby="r-phone-hint" ${val("phone")}>
      <small id="r-phone-hint" style="display:block;margin-top:6px;color:var(--muted);font-size:14px">Sticker'ı WhatsApp'tan isterseniz telefonunuzu girin.</small>
      <label for="r-note">Notunuz <span style="font-weight:400;color:var(--muted)">(isteğe bağlı: tasarım tercihi, adet…)</span></label>
      <textarea id="r-note" rows="3" maxlength="500">${esc(v.note || "")}</textarea>
      <div class="hp" aria-hidden="true"><label for="r-web">Web sitesi</label><input id="r-web" tabindex="-1" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="r-ok"${v.ok ? " checked" : ""}> Bilgilerimin yalnızca QR etiket talebimin işlenmesi ve benimle iletişim kurulması amacıyla kullanılmasını kabul ediyorum.</label>
      <button class="btn" type="submit">Talep gönder</button>
    </form>`;
}

function bindRequestForm() {
  document.getElementById("rf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id);
    const v = {first: g("r-first").value.trim(), last: g("r-last").value.trim(), email: g("r-email").value.trim(),
      phone: g("r-phone").value.trim(), note: g("r-note").value.trim(), ok: g("r-ok").checked};
    const box = g("formbox");
    const fail = msg => { box.innerHTML = requestFormHtml(msg, v); bindRequestForm(); box.querySelector(".msg").scrollIntoView({block: "center"}); };
    if (!v.first || !v.last) return fail("Ad ve soyadınızı yazın.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fail("E-posta adresi geçersiz. Örnek: ornek@mail.com");
    const phone = v.phone ? normalizePhone(v.phone) : null;
    if (v.phone && !phone) return fail("Telefon numarası geçersiz (örnek: 0532 123 45 67). İstemiyorsanız boş bırakabilirsiniz.");
    if (!v.ok) return fail("Devam etmek için bilgilendirme onayını işaretleyin.");
    const done = () => {
      box.innerHTML = `<div class="msg ok" role="status"><b>Talebiniz alındı, teşekkürler ${esc(v.first)}!</b><br>${phone ? `Sticker'ınızı ${esc(prettyPhone(phone))} numarasına WhatsApp'tan göndereceğiz.` : `En kısa sürede ${esc(v.email)} adresinden size ulaşacağız.`}</div>`;
      confetti();
    };
    if (g("r-web").value) return done(); // bot tuzağı: sessizce geç
    ev.submitter && (ev.submitter.disabled = true);
    try {
      const res = await rpc("request_create", {p_first_name: v.first, p_last_name: v.last, p_email: v.email, p_phone: phone,
        p_note: v.note || null});
      if (res?.ok) return done();
      fail({missing: "Ad ve soyadınızı yazın.", bad_email: "E-posta adresi geçersiz.", bad_phone: "Telefon numarası geçersiz.",
        too_many: "Bugün bu bilgilerle zaten talep gönderdiniz; sizinle iletişime geçeceğiz.",
        busy: "Şu an çok yoğunuz, birkaç dakika sonra tekrar deneyin."}[res?.error] || "Talep gönderilemedi, tekrar deneyin.");
    } catch (e) {
      fail("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
    }
  });
}

// Eksik veritabanı kurulumunu telefondan da yapabilmek için SQL'i panoya kopyalar.
const SQL_EDITOR = `https://supabase.com/dashboard/project/${new URL(SUPABASE_URL).hostname.split(".")[0]}/sql/new`;

function setupHtml(text, file) {
  return `<div class="msg err noprint setup">${esc(text)} Kurmak için: <b>1.</b> SQL'i kopyalayın, <b>2.</b> Supabase SQL Editor'ı açın,
    <b>3.</b> yapıştırıp <b>Run</b>'a basın, <b>4.</b> bu sayfayı yenileyin.
    <div class="bar" style="margin:10px 0 0">
      <button class="btn" type="button" data-sql="supabase/${esc(file)}">1. SQL'i kopyala</button>
      <a class="btn" href="${esc(SQL_EDITOR)}" target="_blank" rel="noopener">2. SQL Editor'ı aç</a>
    </div></div>`;
}

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-sql]");
  if (!btn) return;
  const box = btn.closest(".setup");
  let sql;
  try {
    const r = await fetch(btn.dataset.sql, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    sql = await r.text();
  } catch (e) {
    const url = `https://raw.githubusercontent.com/yusufbas34/aracqr/main/${btn.dataset.sql}`;
    return box.insertAdjacentHTML("beforeend", `<p style="margin:10px 0 0">SQL yüklenemedi. <a href="${esc(url)}" target="_blank" rel="noopener">Buradan açıp</a> tümünü seçerek kopyalayın.</p>`);
  }
  try {
    await navigator.clipboard.writeText(sql);
    btn.textContent = "✓ Kopyalandı";
    toast("SQL kopyalandı. Şimdi SQL Editor'ı açıp yapıştırın.");
  } catch (e) {
    // Pano izni yoksa: metni seçili halde göster, kullanıcı “Kopyala” desin
    box.querySelector("textarea")?.remove();
    const ta = Object.assign(document.createElement("textarea"), {value: sql, rows: 8, readOnly: true});
    ta.style.marginTop = "10px";
    box.append(ta); ta.focus(); ta.select();
    toast("Metin seçildi; uzun basıp Kopyala deyin.");
  }
});

// talepler.sql'in güncel sürümü (telefon isteğe bağlı) kurulu mu?
async function requestsUpToDate() {
  try { return (await rpc("aracqr_requests_version", {})) >= 2; } catch (e) { return false; }
}

async function showRequests(rows, given, requests) {
  const upToDate = requests ? await requestsUpToDate() : true;
  const ready = rows.filter(r => !r.phone && !given?.has(String(r.code).toUpperCase())).map(r => r.code);
  const newCount = requests ? requests.filter(r => r.status === "yeni").length : 0;
  const list = (requests || []).filter(r => reqFilter === "all" || r.status === reqFilter);
  const date = t => new Date(t).toLocaleString("tr-TR", {dateStyle: "medium", timeStyle: "short"});
  const digits = p => String(p || "").replace(/\D/g, "");
  show(`
    ${tabsHtml(newCount)}
    ${requests ? "" : setupHtml("Talep formu kurulu değil.", "talepler.sql")}
    ${upToDate ? "" : setupHtml("Talep formu güncellendi (telefon artık isteğe bağlı). Veritabanını güncellemeniz gerekiyor; güncellenene kadar telefonsuz talepler reddedilir.", "talepler.sql")}
    <div class="bar">
      <select id="rfilter" aria-label="Talep durumu">
        <option value="yeni">Yeni talepler (${newCount})</option>
        <option value="verildi">Etiketi verilenler</option>
        <option value="iptal">İptal edilenler</option>
        <option value="all">Tümü (${requests?.length || 0})</option>
      </select>
      <button class="btn" id="csv">Excel için indir (CSV)</button>
    </div>
    <div id="msg"></div>
    <datalist id="ready-codes">${ready.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${requests && !list.length ? "<p>Bu listede talep yok.</p>" : ""}
    <div class="reqs">
      ${list.map(r => `
        <div class="req st-${esc(r.status)}" data-id="${esc(r.id)}">
          <div>
            <h3>${esc(r.first_name)} ${esc(r.last_name)}</h3>
            <div class="meta">
              ${esc(date(r.created_at))}${r.plate ? ` · Plaka: <b>${esc(r.plate)}</b>` : ""}<br>
              <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>
              ${r.phone ? ` · <a href="tel:${esc(r.phone)}">${esc(prettyPhone(r.phone))}</a> ·
              <a href="https://wa.me/${esc(digits(r.phone))}?text=${encodeURIComponent(`Merhaba ${r.first_name}, Araç QR sticker'ınız hazır!`)}" target="_blank" rel="noopener"><b>WhatsApp'tan istiyor</b></a>` : " · <span>E-postayla</span>"}
            </div>
            ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
          </div>
          <div class="act">
            <select data-f="status" aria-label="Durum">
              ${[["yeni", "Yeni"], ["verildi", "Etiketi verildi"], ["iptal", "İptal"]].map(([k, n]) =>
                `<option value="${k}"${k === r.status ? " selected" : ""}>${n}</option>`).join("")}
            </select>
            <input data-f="code" list="ready-codes" placeholder="Verilen etiket kodu" value="${esc(r.tag_code || "")}" aria-label="Verilen etiket kodu">
            <button data-act="save">Kaydet</button>
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const filter = document.getElementById("rfilter");
  filter.value = reqFilter;
  filter.onchange = () => { reqFilter = filter.value; showRequests(rows, given, requests); };
  document.getElementById("csv").onclick = () => {
    const cols = ["created_at", "first_name", "last_name", "email", "phone", "note", "status", "tag_code"];
    // Formdan gelen metin Excel'de formül olarak çalışmasın (=, +, -, @ ile başlayanlar). Telefon sunucuda zaten yalnızca rakam ve +.
    const cell = (v, c) => { let t = String(v ?? ""); if (c !== "phone" && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const csv = "\ufeff" + [cols.join(";"), ...list.map(r => cols.map(c => cell(r[c], c)).join(";"))].join("\r\n");
    const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(new Blob([csv], {type: "text/csv"})), download: "qr-talepleri.csv"});
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest('button[data-act="save"]');
    if (!btn) return;
    const box = btn.closest(".req"), id = Number(box.dataset.id);
    const status = box.querySelector('[data-f="status"]').value;
    const code = box.querySelector('[data-f="code"]').value.trim().toUpperCase();
    const msg = document.getElementById("msg");
    if (code && !rows.some(r => String(r.code).toUpperCase() === code)) {
      msg.innerHTML = `<div class="msg err">${esc(code)} kodunda bir etiket yok.</div>`; return;
    }
    btn.disabled = true;
    try {
      await rpc("admin_request_update", {p_key: adminKey, p_id: id, p_status: status, p_tag_code: code || null});
      if (status === "verildi" && code && given && ready.includes(code)) await setGiven([code], true);
      await showAdmin();
      if (status === "verildi") { confetti(); toast("Talep tamamlandı, etiket yolda!"); } else toast("Kaydedildi.");
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = `<div class="msg err">Kaydedilemedi: ${esc(e.message)}</div>`;
    }
  };
}

// ---------------------------------------------------------------- yönlendirme
async function route() {
  if (SUPABASE_URL.includes("BURAYA") || SUPABASE_KEY.includes("BURAYA")) {
    return showMessage("Kurulum eksik", "index.html dosyasının başındaki SUPABASE_URL ve SUPABASE_KEY değerlerini doldurun.");
  }
  if (params.has("admin")) return showAdminLogin();

  const code = (params.get("k") || "").trim().toUpperCase();
  if (!code) return showHome();

  let tag;
  try { tag = await rpc("tag_lookup", {p_code: code}); }
  catch (e) { return showMessage("Bağlantı hatası", "Sayfayı yenileyip tekrar deneyin."); }

  if (!tag?.exists) return showMessage("Etiket bulunamadı", "Bu QR kod geçerli bir etikete ait değil.");
  if (params.has("degistir")) return showForm(code, CHANGE);
  if (!tag.phone) return showForm(code, CLAIM);
  showCall(code, tag.phone);
}

route();
</script>
