<body>
<main id="app"><p>Yükleniyor…</p></main>

<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;

// ---------------------------------------------------------------- yardımcılar

async function rpc(fn, args) {
  const headers = {"Content-Type": "application/json", apikey: SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY; // eski tip anon key
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method: "POST", headers, body: JSON.stringify(args)});
  const data = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(data?.message || r.statusText); e.status = r.status; throw e; }
  return data;
}

function normalizePhone(raw) {
  let s = String(raw || "").replace(/[^\d+]/g, "");
  if (s.startsWith("00")) s = "+" + s.slice(2);
  if (s.startsWith("+")) return (s.length - 1 >= 8 && s.length - 1 <= 15) ? s : null;
  if (s.startsWith("90") && s.length === 12) return "+" + s;
  if (s.startsWith("0") && s.length === 11) return "+9" + s;
  if (s.startsWith("5") && s.length === 10) return "+90" + s;
  return null;
}

function prettyPhone(p) {
  if (p && p.startsWith("+90") && p.length === 13) {
    const n = p.slice(3);
    return `0${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6,8)} ${n.slice(8)}`;
  }
  return p || "";
}

const plate = code => `<div class="plate"><div class="band">TR</div><div class="txt">${esc(code)}</div></div>`;
const tagLink = code => `${BASE}?k=${encodeURIComponent(code)}`;
// Mobil uygulamadan oluşturulan etiketler ?s=KOD kullanır (supabase/uygulama.sql)
const SELF = params.has("s");
const ownLink = code => SELF ? `${BASE}?s=${encodeURIComponent(code)}` : tagLink(code);

function show(html, wide = false) { app.className = wide === true ? "wide" : wide || ""; app.innerHTML = html; }

// ---------------------------------------------------------------- ekranlar
function showForm(code, {title, intro, button, overwrite}, error = "", phoneVal = "") {
  show(`
    ${plate(code)}
    <h1>${esc(title)}</h1>
    <p>${esc(intro)}</p>
    ${error ? `<div class="msg err">${esc(error)}</div>` : ""}
    <form id="f" novalidate>
      <label for="phone">Telefon numarası</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" value="${esc(phoneVal)}" required>
      <label for="pin">Karttaki PIN</label>
      <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="6 haneli" autocomplete="off" required>
      <button class="btn" type="submit">${esc(button)}</button>
    </form>`);
  const opts = {title, intro, button, overwrite};
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const raw = document.getElementById("phone").value;
    const pin = document.getElementById("pin").value.trim();
    const phone = normalizePhone(raw);
    if (!phone) return showForm(code, opts, "Numara geçersiz. Örnek: 0532 123 45 67", raw);
    if (!/^\d{6}$/.test(pin)) return showForm(code, opts, "PIN 6 haneli olmalı.", raw);
    ev.submitter && (ev.submitter.disabled = true);
    try {
      const res = SELF ? await rpc("self_tag_save", {p_code: code, p_pin: pin, p_phone: phone})
                       : await rpc("tag_save", {p_code: code, p_pin: pin, p_phone: phone, p_overwrite: overwrite});
      if (res.ok) return showSaved(code, res.phone);
      const errors = {
        bad_pin: SELF ? "PIN hatalı. Etiketi oluştururken uygulamada gösterilen 6 haneli PIN'i girin (uygulamada “Etiketlerim” bölümünde de yazar)."
                      : "PIN hatalı. Etiketle birlikte gelen karttaki 6 haneli PIN'i girin.",
        locked: `Çok fazla yanlış deneme. ${res.minutes || 15} dakika sonra tekrar deneyin.`,
        bad_phone: "Numara geçersiz. Örnek: 0532 123 45 67",
        not_found: "Bu etiket bulunamadı.",
      };
      if (res.error === "already") return route(); // biri az önce kaydetmiş
      showForm(code, opts, errors[res.error] || "Kaydedilemedi, tekrar deneyin.", raw);
    } catch (e) {
      showForm(code, opts, "Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.", raw);
    }
  });
}

const CLAIM = {title: "Bu etiketi numaranıza bağlayın", button: "Numarayı kaydet", overwrite: false,
  intro: "Etiket henüz kullanılmıyor. Numaranızı ve etiketle gelen karttaki PIN'i girin. Bundan sonra bu QR'ı okutan herkes sizi arayabilecek."};
const CHANGE = {title: "Numarayı değiştir", button: "Yeni numarayı kaydet", overwrite: true,
  intro: "Yeni numarayı ve etiketin PIN'ini girin."};
const CHANGE_SELF = {...CHANGE, intro: "Yeni numarayı ve etiketi oluştururken uygulamada gösterilen PIN'i girin."};

// Türkiye saatiyle şu an dakika cinsinden (0..1439)
function istanbulMinutes(now = new Date()) {
  const [h, m] = new Intl.DateTimeFormat("en-GB", {timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", hourCycle: "h23"})
    .format(now).split(":").map(Number);
  return h * 60 + m;
}
const hhmm = min => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;

// Sessiz saatler gece yarısını geçebilir (ör. 23:00–07:00)
function inQuietHours(tag, now) {
  if (tag.quiet_start == null || tag.quiet_end == null) return false;
  const t = istanbulMinutes(now), a = tag.quiet_start, b = tag.quiet_end;
  return a < b ? t >= a && t < b : t >= a || t < b;
}

function showCall(code, tag) {
  const phone = tag.phone, quiet = inQuietHours(tag);
  const sms = `sms:${phone}?body=${encodeURIComponent("Merhaba, aracınızla ilgili size ulaşmaya çalışıyorum (Araç QR).")}`;
  const backup = tag.backup_phone ? `
    <div class="msg info" style="margin-top:18px">Ulaşamazsanız${tag.backup_name ? ` <b>${esc(tag.backup_name)}</b>` : ""}:
      <a href="tel:${esc(tag.backup_phone)}"><b>${esc(prettyPhone(tag.backup_phone))}</b></a></div>
    <a class="btn ghost" href="tel:${esc(tag.backup_phone)}" style="margin-top:8px">Yedek numarayı ara</a>` : "";
  if (quiet) {
    show(`
      ${plate(code)}
      <h1>Araç sahibi şu an sessiz saatlerde</h1>
      <p>Araç sahibi ${hhmm(tag.quiet_start)}–${hhmm(tag.quiet_end)} arasında aranmak istemiyor. Acil değilse mesaj gönderin.</p>
      <a class="btn call" href="${esc(sms)}">SMS gönder</a>
      <a class="btn ghost" href="tel:${esc(phone)}">Acil durum: yine de ara</a>
      ${backup}
      <p class="small"><a href="${esc(ownLink(code))}&degistir">Aracın sahibi misiniz? Numarayı değiştirin</a></p>`);
    return; // sessiz saatlerde otomatik arama yok
  }
  show(`
    ${plate(code)}
    <h1>Araç sahibini arayın</h1>
    <p>Arama ekranı açılmadıysa aşağıdaki butona dokunun.</p>
    <a class="btn call" href="tel:${esc(phone)}">Ara: ${esc(prettyPhone(phone))}</a>
    <a class="btn ghost" href="${esc(sms)}">SMS gönder</a>
    ${backup}
    <p class="small"><a href="${esc(ownLink(code))}&degistir">Aracın sahibi misiniz? Numarayı değiştirin</a></p>`);
  setTimeout(() => { location.href = "tel:" + phone; }, 250);
}

function showSaved(code, phone) {
  show(`
    ${plate(code)}
    <div class="msg ok">Kaydedildi. Bu QR artık ${esc(prettyPhone(phone))} numarasını arar.</div>
    <p>PIN kartını saklayın; numarayı değiştirmek için gerekecek.</p>
    <a class="btn" href="${esc(ownLink(code))}">QR'ı test et</a>`);
  confetti();
}

function showMessage(title, text) {
  show(`<h1>${esc(title)}</h1><p>${esc(text)}</p>`);
}

// ---------------------------------------------------------------- yönetim
let adminKey = "";

function showAdminLogin(error = "") {
  show(`
    <h1>Etiket yönetimi</h1>
    <p>Supabase kurulumunda belirlediğin admin şifresini gir.</p>
    ${error ? `<div class="msg err">${esc(error)}</div>` : ""}
    <form id="lf">
      <label for="k">Admin şifresi</label>
      <input id="k" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Giriş yap</button>
    </form>`);
  document.getElementById("lf").addEventListener("submit", ev => {
    ev.preventDefault();
    adminKey = document.getElementById("k").value;
    showAdmin();
  });
}


// ---------------------------------------------------------------- eğlence
function toast(text, ms = 3200) {
  document.querySelector(".toast")?.remove();
  const t = Object.assign(document.createElement("div"), {className: "toast noprint", textContent: text});
  t.setAttribute("role", "status");
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

function confetti() {
  const colors = ["#0a3a9e", "#ffd400", "#0c7a43", "#d9426b", "#5ef2ff", "#f3a25a"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti noprint";
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};` +
      `animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s;border-radius:${i % 3 ? 2 : 50}px`;
    document.body.append(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// ---------------------------------------------------------------- PDF
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = Object.assign(document.createElement("script"), {src, onload: ok, onerror: () => fail(new Error("Kütüphane yüklenemedi"))});
    document.head.append(el);
  });
}

async function loadPdfLibs() {
  await Promise.all([
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"),
  ]);
}

const PX = 25.4 / 96; // CSS px -> mm

async function snap(el) {
  const r = el.getBoundingClientRect();
  const canvas = await html2canvas(el, {scale: 5, backgroundColor: "#ffffff", logging: false});
  return {img: canvas.toDataURL("image/png"), w: r.width * PX, h: r.height * PX};
}

// A4: etiketleri gerçek boyutlarıyla sayfaya dizer. Tek: her sticker / PIN kartı kendi ölçüsünde ayrı sayfa (matbaa, etiket yazıcısı).
async function savePdf(codes) {
  await loadPdfLibs();
  await document.fonts?.ready;
  const {jsPDF} = window.jspdf;
  const tags = codes.map(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)).filter(Boolean);
  let pdf;
  if (paper === "tek") {
    const {w, h} = dims(stickerSize), fmt = [w, h];
    for (const tag of tags) {
      for (const el of tag.querySelectorAll(".sticker, .pin")) {
        if (!el.offsetParent) continue; // seçili modda gizli
        const s = await snap(el);
        if (pdf) pdf.addPage(fmt, "portrait"); else pdf = new jsPDF({unit: "mm", format: fmt, orientation: "portrait"});
        pdf.addImage(s.img, "PNG", (w - s.w) / 2, el.classList.contains("pin") ? 0 : (h - s.h) / 2, s.w, s.h, undefined, "FAST");
      }
    }
  } else {
    pdf = new jsPDF({unit: "mm", format: "a4"});
    const {W, H, M, G} = A4;
    let x = M, y = M, rowH = 0;
    for (const tag of tags) {
      const s = await snap(tag.querySelector(".block"));
      if (x + s.w > W - M + .1) { x = M; y += rowH + G; rowH = 0; }
      if (y + s.h > H - M + .1) { pdf.addPage(); x = M; y = M; rowH = 0; }
      pdf.addImage(s.img, "PNG", x, y, s.w, s.h, undefined, "FAST");
      x += s.w + G; rowH = Math.max(rowH, s.h);
    }
  }
  if (!pdf) throw new Error("Kaydedilecek etiket yok");
  const name = codes.length === 1 ? `etiket-${codes[0]}` : `etiketler-${codes.length}`;
  pdf.save(`${name}-${stickerSize}mm.pdf`);
}


function pref(key, fallback, allowed) {
  try { const v = localStorage.getItem("aracqr-" + key); if (v !== null && (!allowed || allowed.includes(v))) return v; } catch (e) {}
  return fallback;
}
function savePref(key, value) { try { localStorage.setItem("aracqr-" + key, value); } catch (e) {} }

// Seçili ölçüyü ve kağıt tipini etiketlere ve yazdırma sayfasına uygular.
function applySize() {
  const {w, h, k} = dims(stickerSize), grid = document.querySelector(".grid");
  if (grid) {
    grid.style.cssText = `--w:${w}mm;--h:${h}mm;--k:${k}`;
    grid.className = ["grid", printMode, paper === "tek" ? "tek" : "", k < .75 ? "small-size" : ""].join(" ").trim();
  }
  let st = document.getElementById("pagestyle");
  if (!st) { st = document.createElement("style"); st.id = "pagestyle"; document.head.append(st); }
  st.textContent = paper === "tek" ? `@page{size:${w}mm ${h}mm;margin:0}` : `@page{size:A4;margin:${A4.M}mm}`;
}

let printMode = pref("mode", "", ["", "only-sticker", "only-pin"]);
let defaultDesign = pref("design", "klasik");

// Verildi işaretleri (supabase/verildi.sql). Fonksiyon kurulu değilse null döner.
async function loadGiven() {
  try { return new Set(await rpc("admin_given_list", {p_key: adminKey})); }
  catch (e) { return null; }
}

async function setGiven(codes, given) {
  await rpc("admin_set_given", {p_key: adminKey, p_codes: codes, p_given: given});
}

function adminError(text) {
  document.getElementById("msg").innerHTML = `<div class="msg err noprint">${esc(text)}</div>`;
}

// Yazdırır ya da PDF kaydeder; ardından verilmemiş olanları verildi olarak işaretlemeyi önerir.
async function deliver(codes, how, givenSupported) {
  if (!codes.length) return;
  if (how === "pdf") {
    toast("PDF hazırlanıyor…", 60000);
    try { await savePdf(codes); toast("PDF kaydedildi."); }
    catch (e) { document.querySelector(".toast")?.remove(); return adminError("PDF oluşturulamadı: " + e.message); }
  } else {
    document.querySelectorAll(".tag").forEach(t => t.classList.toggle("skip", !codes.includes(t.dataset.code)));
    await new Promise(done => { addEventListener("afterprint", done, {once: true}); print(); });
    document.querySelectorAll(".tag.skip").forEach(t => t.classList.remove("skip"));
  }
  const fresh = codes.filter(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)?.dataset.state === "ready");
  if (!givenSupported || !fresh.length) return;
  if (!confirm(`${fresh.length} etiket verildi olarak işaretlensin mi? Verilen etiketler bu listede bir daha görünmez.`)) return;
  try {
    await setGiven(fresh, true);
    await showAdmin();
    confetti();
    toast(fresh.length === 1 ? `${fresh[0]} yeni sahibine yolculuğa çıktı!` : `${fresh.length} etiket yeni sahiplerine yolculuğa çıktı!`);
  } catch (e) { adminError("İşaretlenemedi: " + e.message); }
}

const designOptions = (sel, withRandom) => {
  const opt = ([k, d]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(d.name)}</option>`;
  const all = Object.entries(DESIGNS);
  return (withRandom ? `<option value="${RANDOM}"${sel === RANDOM ? " selected" : ""}>Rastgele (her etikete farklı)</option>` : "") +
    `<optgroup label="Klasik">${all.filter(([, d]) => !d.group).map(opt).join("")}</optgroup>` +
    `<optgroup label="${FUN}">${all.filter(([, d]) => d.group === FUN).map(opt).join("")}</optgroup>`;
};

    ${given ? "" : setupHtml('"Verildi" takibi kurulu değil.', "verildi.sql")}
    ${appReady ? "" : setupHtml("Android uygulaması için veritabanı kurulumu eksik ya da güncel değil (yedek numara, sessiz saatler, okutma sayacı). Kurulmadan uygulamada QR oluşturulamaz.", "uygulama.sql")}
    <p class="noprint">Talep edene etiket verirken tasarımı seçip <b>Yazdır ve ver</b> ya da <b>PDF kaydet ve ver</b>'e basın; etiket verildi olarak işaretlenip bu listeden kalkar.

  $("paper").onchange = () => { paper = $("paper").value; savePref("paper", paper); applySize(); };
  const redesign = (code, d) => {
    designOf[code] = d;

    tag.querySelector(".sticker").outerHTML = stickerHtml(code, d);
    tag.querySelector('select[data-act="design"]').value = d;
  };
  $("design").onchange = () => {
    defaultDesign = $("design").value;

  $("dice").onclick = () => { codes.forEach(c => redesign(c, pickRandom())); toast("Tasarımlar karıştırıldı!", 1500); };

  $("pdf").onclick = async ev => { ev.target.disabled = true; await deliver(codes, "pdf", !!given); ev.target.disabled = false; };
  const grid = document.querySelector(".grid");
  grid.onchange = ev => {
    if (ev.target.dataset.act === "design") redesign(ev.target.closest(".tag").dataset.code, ev.target.value);

      if (act === "givepdf" || act === "pdf") return await deliver([code], "pdf", !!given);
      await setGiven([code], act === "mark");
      await showAdmin();
      if (act === "mark") toast(`${code} verildi olarak işaretlendi.`);
    } catch (e) { adminError("İşlem yapılamadı: " + e.message); }
    finally { btn.disabled = false; }
  };
  $("add").onclick = async ev => {
    ev.target.disabled = true;
    try { await rpc("admin_add", {p_key: adminKey, p_count: 10}); }
    catch (e) { ev.target.disabled = false; return adminError("Etiket üretilemedi: " + e.message); }
    showAdmin();
  };
}

      </div>
      <label for="r-email">E-posta</label>
      <input id="r-email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@mail.com" required ${val("email")}>
      <label for="r-phone">Telefon <span style="font-weight:400;color:var(--muted)">(isteğe bağlı)</span></label>
      <input id="r-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" aria-describedby="r-phone-hint" ${val("phone")}>

      <label for="r-note">Notunuz <span style="font-weight:400;color:var(--muted)">(isteğe bağlı: tasarım tercihi, adet…)</span></label>
      <textarea id="r-note" rows="3" maxlength="500">${esc(v.note || "")}</textarea>
      <div class="hp" aria-hidden="true"><label for="r-web">Web sitesi</label><input id="r-web" tabindex="-1" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="r-ok"${v.ok ? " checked" : ""}> Bilgilerimin yalnızca QR etiket talebimin işlenmesi ve benimle iletişim kurulması amacıyla kullanılmasını kabul ediyorum.</label>
      <button class="btn" type="submit">Talep gönder</button>
    </form>`;
}

function bindRequestForm() {
  document.getElementById("rf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id);
    const v = {first: g("r-first").value.trim(), last: g("r-last").value.trim(), email: g("r-email").value.trim(),
      phone: g("r-phone").value.trim(), note: g("r-note").value.trim(), ok: g("r-ok").checked};
    const box = g("formbox");
    const fail = msg => { box.innerHTML = requestFormHtml(msg, v); bindRequestForm(); box.querySelector(".msg").scrollIntoView({block: "center"}); };
    if (!v.first || !v.last) return fail("Ad ve soyadınızı yazın.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fail("E-posta adresi geçersiz. Örnek: ornek@mail.com");
    const phone = v.phone ? normalizePhone(v.phone) : null;
    if (v.phone && !phone) return fail("Telefon numarası geçersiz (örnek: 0532 123 45 67). İstemiyorsanız boş bırakabilirsiniz.");
    if (!v.ok) return fail("Devam etmek için bilgilendirme onayını işaretleyin.");
    const done = () => {
      box.innerHTML = `<div class="msg ok" role="status"><b>Talebiniz alındı, teşekkürler ${esc(v.first)}!</b><br>${phone ? `Sticker'ınızı ${esc(prettyPhone(phone))} numarasına WhatsApp'tan göndereceğiz.` : `En kısa sürede ${esc(v.email)} adresinden size ulaşacağız.`}</div>`;
      confetti();
    };
    if (g("r-web").value) return done(); // bot tuzağı: sessizce geç
    ev.submitter && (ev.submitter.disabled = true);
    try {
      const res = await rpc("request_create", {p_first_name: v.first, p_last_name: v.last, p_email: v.email, p_phone: phone,
        p_note: v.note || null});
      if (res?.ok) return done();
      fail({missing: "Ad ve soyadınızı yazın.", bad_email: "E-posta adresi geçersiz.", bad_phone: "Telefon numarası geçersiz.",
        too_many: "Bugün bu bilgilerle zaten talep gönderdiniz; sizinle iletişime geçeceğiz.",
        busy: "Şu an çok yoğunuz, birkaç dakika sonra tekrar deneyin."}[res?.error] || "Talep gönderilemedi, tekrar deneyin.");
    } catch (e) {
      fail("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
    }
  });
}

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-sql]");
  if (!btn) return;
  const box = btn.closest(".setup");
  let sql;
  try {
    const r = await fetch(btn.dataset.sql, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    sql = await r.text();
  } catch (e) {
    const url = `https://raw.githubusercontent.com/yusufbas34/aracqr/main/${btn.dataset.sql}`;
    return box.insertAdjacentHTML("beforeend", `<p style="margin:10px 0 0">SQL yüklenemedi. <a href="${esc(url)}" target="_blank" rel="noopener">Buradan açıp</a> tümünü seçerek kopyalayın.</p>`);
  }
  try {
    await navigator.clipboard.writeText(sql);
    btn.textContent = "✓ Kopyalandı";
    toast("SQL kopyalandı. Şimdi SQL Editor'ı açıp yapıştırın.");
  } catch (e) {
    // Pano izni yoksa: metni seçili halde göster, kullanıcı “Kopyala” desin
    box.querySelector("textarea")?.remove();
    const ta = Object.assign(document.createElement("textarea"), {value: sql, rows: 8, readOnly: true});
    ta.style.marginTop = "10px";
    box.append(ta); ta.focus(); ta.select();
    toast("Metin seçildi; uzun basıp Kopyala deyin.");
  }
});

let adminTab = "tags", reqFilter = "yeni";

let orderBadge = 0;

function tabsHtml(newCount) {
  const tab = (id, name, n) => `<button data-tab="${id}" class="${adminTab === id ? "on" : ""}">${name}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  return `<div class="tabs noprint">
    ${tab("tags", "Etiketler")}${tab("requests", "QR talepleri", newCount)}${tab("orders", "Siparişler", orderBadge)}${tab("settings", "Ayarlar")}
  </div>`;
}

function bindTabs() {
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { adminTab = b.dataset.tab; showAdmin(); });
}

async function loadRequests() {
  try { const r = await rpc("admin_requests", {p_key: adminKey}); return Array.isArray(r) ? r : null; }
  catch (e) { return null; }
}

// talepler.sql'in güncel sürümü (telefon isteğe bağlı) kurulu mu?
async function requestsUpToDate() {
  try { return (await rpc("aracqr_requests_version", {})) >= 2; } catch (e) { return false; }
}

async function showRequests(rows, given, requests) {
  const upToDate = requests ? await requestsUpToDate() : true;
  const ready = rows.filter(r => !r.phone && !given?.has(String(r.code).toUpperCase())).map(r => r.code);
  const newCount = requests ? requests.filter(r => r.status === "yeni").length : 0;
  const list = (requests || []).filter(r => reqFilter === "all" || r.status === reqFilter);
  const date = t => new Date(t).toLocaleString("tr-TR", {dateStyle: "medium", timeStyle: "short"});
  const digits = p => String(p || "").replace(/\D/g, "");
  show(`
    ${tabsHtml(newCount)}
    ${requests ? "" : setupHtml("Talep formu kurulu değil.", "talepler.sql")}
    ${upToDate ? "" : setupHtml("Talep formu güncellendi (telefon artık isteğe bağlı). Veritabanını güncellemeniz gerekiyor; güncellenene kadar telefonsuz talepler reddedilir.", "talepler.sql")}
    <div class="bar">
      <select id="rfilter" aria-label="Talep durumu">
        <option value="yeni">Yeni talepler (${newCount})</option>
        <option value="verildi">Etiketi verilenler</option>
        <option value="iptal">İptal edilenler</option>
        <option value="all">Tümü (${requests?.length || 0})</option>
      </select>
      <button class="btn" id="csv">Excel için indir (CSV)</button>
    </div>
    <div id="msg"></div>
    <datalist id="ready-codes">${ready.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${requests && !list.length ? "<p>Bu listede talep yok.</p>" : ""}
    <div class="reqs">
      ${list.map(r => `
        <div class="req st-${esc(r.status)}" data-id="${esc(r.id)}">
          <div>
            <h3>${esc(r.first_name)} ${esc(r.last_name)}</h3>
            <div class="meta">
              ${esc(date(r.created_at))}${r.plate ? ` · Plaka: <b>${esc(r.plate)}</b>` : ""}<br>
              <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>
              ${r.phone ? ` · <a href="tel:${esc(r.phone)}">${esc(prettyPhone(r.phone))}</a> ·
              <a href="https://wa.me/${esc(digits(r.phone))}?text=${encodeURIComponent(`Merhaba ${r.first_name}, Araç QR sticker'ınız hazır!`)}" target="_blank" rel="noopener"><b>WhatsApp'tan istiyor</b></a>` : " · <span>E-postayla</span>"}
            </div>
            ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
          </div>
          <div class="act">
            <select data-f="status" aria-label="Durum">
              ${[["yeni", "Yeni"], ["verildi", "Etiketi verildi"], ["iptal", "İptal"]].map(([k, n]) =>
                `<option value="${k}"${k === r.status ? " selected" : ""}>${n}</option>`).join("")}
            </select>
            <input data-f="code" list="ready-codes" placeholder="Verilen etiket kodu" value="${esc(r.tag_code || "")}" aria-label="Verilen etiket kodu">
            <button data-act="save">Kaydet</button>
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const filter = document.getElementById("rfilter");
  filter.value = reqFilter;
  filter.onchange = () => { reqFilter = filter.value; showRequests(rows, given, requests); };
  document.getElementById("csv").onclick = () => {
    const cols = ["created_at", "first_name", "last_name", "email", "phone", "note", "status", "tag_code"];
    // Formdan gelen metin Excel'de formül olarak çalışmasın (=, +, -, @ ile başlayanlar). Telefon sunucuda zaten yalnızca rakam ve +.
    const cell = (v, c) => { let t = String(v ?? ""); if (c !== "phone" && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const csv = "\ufeff" + [cols.join(";"), ...list.map(r => cols.map(c => cell(r[c], c)).join(";"))].join("\r\n");
    const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(new Blob([csv], {type: "text/csv"})), download: "qr-talepleri.csv"});
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest('button[data-act="save"]');
    if (!btn) return;
    const box = btn.closest(".req"), id = Number(box.dataset.id);
    const status = box.querySelector('[data-f="status"]').value;
    const code = box.querySelector('[data-f="code"]').value.trim().toUpperCase();
    const msg = document.getElementById("msg");
    if (code && !rows.some(r => String(r.code).toUpperCase() === code)) {
      msg.innerHTML = `<div class="msg err">${esc(code)} kodunda bir etiket yok.</div>`; return;
    }
    btn.disabled = true;
    try {
      await rpc("admin_request_update", {p_key: adminKey, p_id: id, p_status: status, p_tag_code: code || null});
      if (status === "verildi" && code && given && ready.includes(code)) await setGiven([code], true);
      await showAdmin();
      if (status === "verildi") { confetti(); toast("Talep tamamlandı, etiket yolda!"); } else toast("Kaydedildi.");
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = `<div class="msg err">Kaydedilemedi: ${esc(e.message)}</div>`;
    }
  };
}

// Siparişin A4 baskı PDF'i: 6 farklı ölçü, 9 sticker (shared/sticker.js orderSheetHtml)
async function orderPdf(o) {
  await loadPdfLibs();
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-30000px;top:0;background:#fff";
  box.innerHTML = orderSheetHtml(o.tag_code, o.design, selfLink(o.tag_code));
  document.body.append(box);
  try {
    await document.fonts?.ready;
    const canvas = await html2canvas(box.firstElementChild, {scale: 4, backgroundColor: "#ffffff", logging: false});
    const pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
    pdf.addImage(canvas.toDataURL("image/png"), "PNG", 10, 10, 190, 277, undefined, "FAST");
    return pdf.output("blob");
  } finally { box.remove(); }
}

function downloadBlob(blob, name) {
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function printerMail(o) {
  const subject = `Baskı siparişi ${o.code}`;
  const body = `Merhaba,

Ekteki A4 sayfayı su geçirmez, UV dayanımlı vinil sticker olarak 1 adet basmanızı rica ederim. Kesim çizgileri dosyadadır.

Sipariş no: ${o.code}
Teslimat adresi:
${o.full_name}
${o.address}
${o.district} / ${o.city}
Tel: ${prettyPhone(o.phone)}

Teşekkürler.`;
  return {subject, body};
}

function waLink(o, text) {
  return `https://wa.me/${String(o.phone).replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;
}

function customerMessage(o) {
  const first = o.full_name.split(" ")[0];
  return {
    odeme_bekleniyor: `Merhaba ${first}, Araç QR siparişiniz (${o.code}) için ${o.amount} TL ödemenizi bekliyoruz.`,
    odeme_bildirildi: `Merhaba ${first}, Araç QR siparişinizin (${o.code}) ödemesini kontrol ediyoruz.`,
    onaylandi: `Merhaba ${first}, Araç QR siparişinizin (${o.code}) ödemesi alındı, stickerlarınız baskıya hazırlanıyor.`,
    baskida: `Merhaba ${first}, Araç QR stickerlarınız (${o.code}) baskıda. Kargoya verilince takip numarasını ileteceğiz.`,
    kargolandi: `Merhaba ${first}, Araç QR siparişiniz (${o.code}) kargoya verildi.${o.tracking ? ` Takip no: ${o.tracking}` : ""} İyi kullanımlar!`,
    iptal: `Merhaba ${first}, Araç QR siparişiniz (${o.code}) iptal edildi.`,
  }[o.status] || `Merhaba ${first}, Araç QR siparişiniz (${o.code}) hakkında yazıyoruz.`;

async function showOrders(orders, requests) {

  const date = t => t ? new Date(t).toLocaleString("tr-TR", {dateStyle: "medium", timeStyle: "short"}) : "";

  show(`
    ${tabsHtml(requests ? requests.filter(r => r.status === "yeni").length : 0)}
    ${orders ? "" : setupHtml("Sipariş sistemi kurulu değil.", "siparis.sql")}
    ${orders && shop && !(shop.active && shop.iban && shop.account_name) ? `<div class="msg err">Satış kapalı: uygulamada sipariş alınmıyor. <b>Ayarlar</b> sekmesinden IBAN ve alıcı adını girip satışı açın.</div>` : ""}
    <div class="bar">
      <select id="ofilter" aria-label="Sipariş durumu">
        ${[...Object.entries(ORDER_STATUS).map(([k, n]) => [k, `${n} (${count(k)})`]), ["all", `Tümü (${orders?.length || 0})`]]
          .map(([k, n]) => `<option value="${k}"${k === orderFilter ? " selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
    </div>
    <div id="msg"></div>
    ${orders && !list.length ? "<p>Bu listede sipariş yok.</p>" : ""}
    <div class="reqs">
      ${list.map(o => `
        <div class="req order st-${esc(o.status)}" data-id="${esc(o.id)}">
          <div>
            <h3>${esc(o.code)} · ${esc(o.amount)} TL</h3>
            <div class="meta">
              <b>${esc(ORDER_STATUS[o.status] || o.status)}</b> · ${esc(date(o.created_at))}${o.paid_at ? ` · ödeme bildirimi: ${esc(date(o.paid_at))}` : ""}<br>
              <b>${esc(o.full_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(prettyPhone(o.phone))}</a>
              · <a href="${esc(waLink(o, customerMessage(o)))}" target="_blank" rel="noopener">WhatsApp</a>
              ${o.email ? ` · <a href="mailto:${esc(o.email)}">${esc(o.email)}</a>` : ""}<br>
              ${esc(o.address)}, ${esc(o.district)} / ${esc(o.city)}<br>
              Tasarım: ${esc(DESIGNS[o.design]?.name || o.design)} · QR: <a href="${esc(selfLink(o.tag_code))}" target="_blank" rel="noopener">${esc(o.tag_code)}</a>
              ${o.tracking ? ` · Takip no: <b>${esc(o.tracking)}</b>` : ""}
            </div>
            ${o.note ? `<div class="note">Müşteri notu: ${esc(o.note)}</div>` : ""}
            ${o.admin_note ? `<div class="note">Notunuz: ${esc(o.admin_note)}</div>` : ""}
          </div>
          <div class="act">
            ${["odeme_bekleniyor", "odeme_bildirildi"].includes(o.status) ? `<button data-act="approve" style="background:var(--ok)">✓ Ödeme geldi, onayla</button>` : ""}
            <button data-act="pdf">Baskı PDF'i indir</button>
            ${["onaylandi", "baskida"].includes(o.status) ? `<button data-act="mail">Baskıcıya e-posta</button>
              ${canShareFiles ? `<button data-act="share">PDF'i paylaş (e-posta ekli)</button>` : ""}` : ""}
            <input data-f="tracking" placeholder="Kargo takip no" value="${esc(o.tracking || "")}" aria-label="Kargo takip no">
            ${["onaylandi", "baskida"].includes(o.status) ? `<button data-act="shipped">Kargolandı</button>` : ""}
            <select data-f="status" aria-label="Durum">${Object.entries(ORDER_STATUS).map(([k, n]) =>
              `<option value="${k}"${k === o.status ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
            <input data-f="note" placeholder="Kendi notunuz" value="${esc(o.admin_note || "")}" aria-label="Not">
            <button data-act="save" style="background:#2b3240">Kaydet</button>
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const filter = document.getElementById("ofilter");
  filter.onchange = () => { orderFilter = filter.value; showOrders(orders, requests); };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const box = btn.closest(".req"), o = orders.find(x => String(x.id) === box.dataset.id), act = btn.dataset.act;
    const f = name => box.querySelector(`[data-f="${name}"]`).value.trim();
    const msg = document.getElementById("msg");
    const update = async (status, done) => {
      await rpc("admin_order_update", {p_key: adminKey, p_id: o.id, p_status: status, p_tracking: f("tracking") || null, p_admin_note: f("note") || null});
      await showAdmin();
      if (done) done();
    };
    const fileName = `baski-${o.code}.pdf`;
    btn.disabled = true;
    try {
      if (act === "approve") {
        if (!confirm(`${o.code}: ${o.amount} TL hesabınıza geldi mi? Onaylanınca sipariş baskıya gönderilecekler listesine geçer.`)) return;
        await update("onaylandi", () => { confetti(); toast("Ödeme onaylandı. Müşteriye WhatsApp'tan haber verebilirsiniz."); });
      } else if (act === "pdf") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        downloadBlob(await orderPdf(o), fileName);
        toast("PDF indirildi.");
      } else if (act === "mail") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        downloadBlob(await orderPdf(o), fileName);
        const m = printerMail(o);
        location.href = `mailto:${encodeURIComponent(shop?.printer_email || "")}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
        toast(`PDF indirildi: ${fileName}. Açılan e-postaya ekleyip gönderin.`, 6000);
        if (o.status === "onaylandi" && confirm("E-postayı gönderdiyseniz sipariş “Baskıda” olarak işaretlensin mi?")) await update("baskida");
      } else if (act === "share") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        const m = printerMail(o);
        await navigator.share({files: [new File([await orderPdf(o)], fileName, {type: "application/pdf"})], title: m.subject,
          text: `${shop?.printer_email ? `Alıcı: ${shop.printer_email}\n\n` : ""}${m.body}`});
        document.querySelector(".toast")?.remove();
        if (o.status === "onaylandi" && confirm("Gönderdiyseniz sipariş “Baskıda” olarak işaretlensin mi?")) await update("baskida");
      } else if (act === "shipped") {
        if (!f("tracking") && !confirm("Takip numarası girmeden kargolandı olarak işaretlensin mi?")) return;
        await update("kargolandi", () => toast("Kargolandı. Müşteriye WhatsApp'tan takip numarasını iletebilirsiniz."));
      } else if (act === "save") {
        if (f("status") === "iptal" && o.status !== "iptal" && !confirm(`${o.code} iptal edilsin mi?`)) return;
        await update(f("status"), () => toast("Kaydedildi."));
      }
    } catch (e) {
      if (e.name !== "AbortError") msg.innerHTML = `<div class="msg err">İşlem yapılamadı: ${esc(e.message)}</div>`;
    } finally { btn.disabled = false; }
  };
}

// TR IBAN: TR + 24 rakam, mod 97 kontrolü
function validIban(iban) {
  const s = iban.replace(/\s/g, "").toUpperCase();
  if (!/^TR\d{24}$/.test(s)) return false;
  const num = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let r = 0;
  for (const ch of num) r = (r * 10 + Number(ch)) % 97;
  return r === 1;
}

      toast(`Bulundu: ${chat.first_name || chat.title || chat.id}. Şimdi Kaydet'e basın.`);
    } catch (e) { toast("Telegram'a ulaşılamadı."); }
  };
  const test = document.getElementById("notify-test");
  if (test) test.onclick = async () => {
    test.disabled = true;
    try {
      const r = await rpc("admin_notify_test", {p_key: adminKey});
      toast(!r.pg_net ? "Supabase'de pg_net eklentisi açık değil: Database > Extensions'tan pg_net'i açın." :
        r.sent ? "Deneme bildirimi gönderildi. Telegram / e-postanızı kontrol edin." : "Önce bilgileri girip Kaydet'e basın.", 7000);
    } catch (e) { toast("Gönderilemedi: " + e.message); }
    test.disabled = false;
  };
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id).value.trim();
    const active = document.getElementById("s-active").checked, iban = g("s-iban").replace(/\s/g, "").toUpperCase();
    if (iban && !validIban(iban)) return showSettings(requests, "IBAN hatalı görünüyor: TR ile başlayan 26 karakter olmalı ve kontrol hanesi tutmalı.");
    if (active && (!iban || !g("s-name"))) return showSettings(requests, "Satışı açmak için IBAN ve alıcı adı gerekli.");
    const price = parseInt(g("s-price"), 10);
    if (!(price >= 0)) return showSettings(requests, "Fiyat geçersiz.");
    try {
      const notify = document.getElementById("s-tg-token") ? {p_telegram_bot_token: g("s-tg-token"), p_telegram_chat_id: g("s-tg-chat"),
        p_resend_api_key: g("s-resend"), p_notify_email: g("s-notify")} : {};
      if (notify.p_notify_email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(notify.p_notify_email)) return showSettings(requests, "Bildirim e-postası geçersiz.");
      await rpc("admin_shop_set", {p_key: adminKey, p_active: active, p_price: price, p_iban: iban, p_account_name: g("s-name"),
        p_bank_name: g("s-bank"), p_printer_email: g("s-printer"), p_shipping_text: g("s-ship"), ...notify});
      await showSettings(requests);
      toast(active ? "Kaydedildi. Satış açık." : "Kaydedildi. Satış kapalı.");
    } catch (e) { showSettings(requests, "Kaydedilemedi: " + e.message); }
  });
}

// ---------------------------------------------------------------- yönlendirme
async function route() {
  if (SUPABASE_URL.includes("BURAYA") || SUPABASE_KEY.includes("BURAYA")) {
    return showMessage("Kurulum eksik", "index.html dosyasının başındaki SUPABASE_URL ve SUPABASE_KEY değerlerini doldurun.");
  }
  if (params.has("admin")) return showAdminLogin();

  const code = (params.get(SELF ? "s" : "k") || "").trim().toUpperCase();
  if (!code) return showHome();

  let tag;
  try { tag = await rpc(SELF ? "self_tag_lookup" : "tag_lookup", {p_code: code}); }
  catch (e) { return showMessage("Bağlantı hatası", "Sayfayı yenileyip tekrar deneyin."); }

  if (!tag?.exists) return showMessage("Etiket bulunamadı", "Bu QR kod geçerli bir etikete ait değil.");
  if (params.has("degistir")) return showForm(code, SELF ? CHANGE_SELF : CHANGE);
  if (!tag.phone) return showForm(code, CLAIM);
  showCall(code, tag);
}

route();
</script>
