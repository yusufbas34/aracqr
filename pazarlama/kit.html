<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Araç QR Instagram kiti</title>
<!-- Instagram görsellerinin kaynağı. PNG'ler pazarlama/uret.js ile buradan üretilir; metni değiştirip yeniden üretebilirsiniz. -->
<link rel="stylesheet" href="../app/app.css">
<link rel="stylesheet" href="../app/sticker.css">
<script src="../app/vendor/qrcode.js"></script>
<script src="../app/sticker.js"></script>
<style>
body{margin:0;background:#888;display:flex;flex-wrap:wrap;gap:40px;padding:40px;font-family:"Barlow",sans-serif}
.ab{position:relative;overflow:hidden;flex:none;color:#fff;font-family:"Barlow",sans-serif}
.blue{background:radial-gradient(120% 80% at 80% 10%,#2a6cf0 0%,#0a3a9e 55%,#061f5c 100%)}
.yellow{background:#ffd23f;color:#111418}
.dark{background:radial-gradient(120% 80% at 20% 0%,#24304a 0%,#0d1324 70%)}
.ab p,.ab h1{color:inherit}
.frame{position:absolute;left:80px;right:80px;display:flex;flex-direction:column}
.vis{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:30px}
.yellow .num{background:#0a3a9e;color:#ffd23f}
.h{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;line-height:.98;letter-spacing:.005em;margin:0}
.p{font-weight:600;line-height:1.25;margin:0}
.pill{display:inline-block;background:#ffd23f;color:#111418;font-weight:700;border-radius:999px}
.yellow .pill{background:#0a3a9e;color:#fff}
.brandbar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;font-weight:700}
.brandbar img{border-radius:22%}
.st{filter:drop-shadow(0 30px 50px rgba(0,0,0,.35))}
.grid.st{display:block}
.fan{position:absolute;display:flex;justify-content:center;align-items:flex-end}
.fan .grid{margin:0 -30px}
.mark{color:#ffd23f}
.yellow .mark{color:#0a3a9e}
.strike{text-decoration:line-through;text-decoration-thickness:8px;text-decoration-color:#ff4d4d}
.phone{position:absolute;background:#111;border-radius:70px;padding:22px;box-shadow:0 40px 80px rgba(0,0,0,.45)}
.phone .scr{background:#eef0f3;border-radius:50px;overflow:hidden;width:100%;height:100%;color:#111418;display:flex;flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:999px;font-weight:700}
.hl{display:flex;align-items:center;justify-content:center}
.hl .ring{width:640px;height:640px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#0a3a9e}
.hl .ring .ic{font-size:250px;line-height:1}
.hl .ring .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:92px;letter-spacing:.02em}
.shot{position:relative;background:#111;border-radius:64px;padding:18px;box-shadow:0 40px 80px rgba(0,0,0,.45)}
.shot img{display:block;border-radius:48px;width:100%;height:100%;object-fit:cover;object-position:top}
.card{background:#fff;color:#111418;border-radius:36px;padding:34px 38px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.qa{display:flex;flex-direction:column;gap:22px}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:860px}
.msgs div{background:#fff;color:#111418;border-radius:28px;padding:26px 18px;text-align:center;font-weight:700;font-size:40px;line-height:1.15}
.msgs div i{display:block;font-style:normal;font-size:72px;margin-bottom:8px}
.pollbox{position:absolute;left:120px;right:120px;border:5px dashed rgba(255,255,255,.7);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;text-align:center}
.yellow .pollbox{border-color:rgba(10,58,158,.6);color:#0a3a9e}
.photo{border-radius:44px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.num{display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;border-radius:50%;background:#ffd23f;color:#0a3a9e;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:72px;flex:none}
</style>
</head>
<body>
<div id="out"></div>
<script>
const LINK = "https://arac.bulqr.com.tr/?s=SAB3C9DE";
// zoom: sticker'lar mm ölçüsünde çizilir (96 dpi); Instagram tuvalinde görünür olsun diye büyütülür
const st = (design, size = "60x90", phrase, code = "SAB3C9DE", extra = "", zoom = 2.4) => {
  const {w, h, k} = dims(size);
  return `<div class="grid st${k < .75 ? " small-size" : ""}" style="--w:${w}mm;--h:${h}mm;--k:${k};zoom:${zoom};${extra}">${stickerHtml(code, design, LINK, phrase)}</div>`;
};
// metin üstte, görsel kalan alanda ortada: hiçbir zaman üst üste binmez
const frame = (text, vis, top = 250, bottom = 210) => `<div class="frame" style="top:${top}px;bottom:${bottom}px"><div>${text}</div><div class="vis"><div class="fit">${vis}</div></div></div>`;
const logo = px => `<img src="../app/logo.svg" width="${px}" height="${px}" alt="">`;
const brand = (y, dark) => `<div class="brandbar" style="bottom:${y}px;font-size:40px;${dark ? "color:#0a3a9e" : ""}">${logo(64)}Araç QR · Play Store'da “Araç QR” ara</div>`;
const AB = [];
const add = (name, w, h, cls, html) => AB.push(`<div class="ab ${cls}" data-name="${name}" style="width:${w}px;height:${h}px">${html}</div>`);

// ---------------- Reels kapakları 1080x1920 (yazılar üstte 250 px'ten sonra; alt 400 px'te yalnızca marka satırı)
const fan = (a, b, c, sz = "55x85", z = 2.1) => `<div style="display:flex;align-items:center">${st(a, sz, null, "SAB3C9DE", "transform:rotate(-10deg) translate(14mm,4mm)", z)}${st(b, "60x90", null, "SAB3C9DE", "position:relative;z-index:2", z)}${st(c, sz, null, "SAB3C9DE", "transform:rotate(10deg) translate(-14mm,4mm)", z)}</div>`;
add("reels-1-hatali-park", 1080, 1920, "blue", frame(`
    <span class="pill" style="font-size:40px;padding:12px 30px">PARK DERDİ</span>
    <h1 class="h" style="font-size:150px;margin-top:30px">Hatalı mı <span class="mark">park ettin?</span></h1>
    <p class="p" style="font-size:52px;margin-top:22px">Yolunu kapattığın kişi seni tek dokunuşla arasın.</p>`,
  st("klasik", "74x105", null, "SAB3C9DE", "transform:rotate(-4deg)", 2.5)) + brand(120));

add("reels-2-numarani-yazma", 1080, 1920, "yellow", frame(`
    <h1 class="h" style="font-size:136px">Camına <span class="strike">0532 •••</span><br>numaranı yazma!</h1>
    <p class="p" style="font-size:52px;margin-top:22px">Numaran görünmeden sana ulaşsınlar. 📵</p>`,
  st("plaka", "74x105", null, "SAB3C9DE", "transform:rotate(3deg)", 2.5)) + brand(120, true));

add("reels-3-gece-3te", 1080, 1920, "dark", frame(`
    <span class="chip" style="font-size:40px;padding:12px 28px">🔕 RAHATSIZ ETMEYİN</span>
    <h1 class="h" style="font-size:136px;margin-top:26px">Gece 3'te <span class="mark">aranmak</span> istemiyor musun?</h1>
    <p class="p" style="font-size:50px;margin-top:20px;opacity:.92">Seçtiğin saatlerde arama yok, sadece mesaj.</p>`,
  st("gece", "74x105", null, "SAB3C9DE", "transform:rotate(-3deg)", 2.3)) + brand(120));

add("reels-4-ucretsiz-yap", 1080, 1920, "blue", frame(`
    <h1 class="h" style="font-size:150px">Ücretsiz yap, <span class="mark">evde yazdır.</span></h1>
    <p class="p" style="font-size:50px;margin-top:22px">29 tasarım · 16 komik söz. İstersen su geçirmez seti <b class="mark">biz basalım</b>.</p>`,
  fan("kedi", "sarikart", "cay")) + brand(120));

add("reels-5-derbi-gunu", 1080, 1920, "dark", frame(`<div style="text-align:center">
    <span class="chip" style="font-size:40px;padding:12px 28px">⚽ TAKIM RENKLERİ</span>
    <h1 class="h" style="font-size:150px;margin-top:26px">Derbi günü <span class="mark">park ettim</span> 😅</h1>
    <p class="p" style="font-size:50px;margin-top:20px;opacity:.92">Renklerini seç, aracına yapıştır.</p></div>`,
  fan("sarilacivert", "sarikirmizi", "siyahbeyaz")) + brand(120));

add("reels-6-not-birakma", 1080, 1920, "yellow", frame(`
    <h1 class="h" style="font-size:146px">Silecek altına not bırakma <span class="mark">devri bitti.</span></h1>
    <p class="p" style="font-size:52px;margin-top:22px">Okut → ara ya da hazır mesaj at.</p>`,
  st("postit", "74x105", null, "SAB3C9DE", "transform:rotate(-3deg)", 2.4)) + brand(120, true));

// ---------------- Profil fotoğrafı 1080x1080 (daire içinde kalır)
add("profil-fotografi", 1080, 1080, "blue", `
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${logo(700)}</div>`);

// ---------------- Öne çıkan hikâye kapakları 1080x1920
[["one-cikan-nasil", "❓", "NASIL?"], ["one-cikan-tasarimlar", "🎨", "TASARIM"], ["one-cikan-siparis", "📦", "SİPARİŞ"],
 ["one-cikan-sss", "💬", "SSS"], ["one-cikan-yorumlar", "⭐", "YORUMLAR"]].forEach(([n, ic, t]) =>
  add(n, 1080, 1920, "blue hl", `<div class="ring"><div class="ic">${ic}</div><div class="t">${t}</div></div>`));

// ---------------- Gönderi (kaydırmalı) 1080x1350
add("gonderi-1-kapak", 1080, 1350, "blue", frame(`
    <span class="pill" style="font-size:36px;padding:10px 26px">KAYDIR →</span>
    <h1 class="h" style="font-size:128px;margin-top:24px">3 adımda <span class="mark">araç QR'ın</span> hazır.</h1>`,
  st("klasik", "60x90", null, "SAB3C9DE", "transform:rotate(5deg)", 2.2), 90, 140) + brand(50));
[["gonderi-2-adim1", "1", "Tasarımını seç", "29 tasarım: klasik, komik, takım renkleri. Yana kaydır, sözünü değiştir.", "kahve"],
 ["gonderi-3-adim2", "2", "Numaranı gir", "Numaran QR'ın içinde değil, güvenli sunucuda. Sticker'da yazmaz.", "plaka"],
 ["gonderi-4-adim3", "3", "Yazdır ya da biz basalım", "Evde ücretsiz yazdır ya da su geçirmez vinil seti kapına gelsin.", "sarikart"]]
  .forEach(([n, no, t, d, des]) => { const y = n.endsWith("adim2"); add(n, 1080, 1350, y ? "yellow" : "blue", frame(`
    <div style="display:flex;gap:30px;align-items:center"><span class="num">${no}</span><h1 class="h" style="font-size:96px">${t}</h1></div>
    <p class="p" style="font-size:44px;margin-top:24px">${d}</p>`, st(des, "60x90", null, "SAB3C9DE", "", 2.0), 90, 140) + brand(50, y)); });
add("gonderi-5-indir", 1080, 1350, "yellow", `
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;padding:80px">
    ${logo(260)}
    <h1 class="h" style="font-size:120px">Ücretsiz dene</h1>
    <p class="p" style="font-size:50px">Play Store'da <b>“Araç QR”</b> ara<br>ya da profildeki bağlantıya dokun.</p>
    <span class="pill" style="font-size:44px;padding:16px 40px">Hatalı parkta seni arasınlar</span>
  </div>`);

// ---------------- Hikâye şablonu 1080x1920
add("hikaye-baglanti", 1080, 1920, "blue", frame(`<div style="text-align:center">
    <h1 class="h" style="font-size:130px">Sen de <span class="mark">QR'ını yap</span></h1>
    <p class="p" style="font-size:50px;margin-top:20px">Ücretsiz · Hesap yok · Numaran gizli</p></div>`,
  st("ozur", "74x105", null, "SAB3C9DE", "", 2.2), 250, 480) + `
  <div style="position:absolute;left:140px;right:140px;bottom:270px;height:150px;border:5px dashed rgba(255,255,255,.7);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700">👆 Bağlantı çıkartmasını buraya koy</div>`);


// ================================================================ AY 1 İÇERİK PAKETİ (pazarlama/icerik-takvimi.html)
const shot = (src, w = 470) => `<div class="shot" style="width:${w}px;height:${Math.round(w * 1920 / 1080)}px"><img src="${src}" alt=""></div>`;
const S5 = "../android/store/screen-5-okutan.png", S6 = "../android/store/screen-6-sessiz.png", S8 = "../android/store/screen-8-pin.png", S4 = "../android/store/screen-4-qr.png";

// ---------------- Yeni reels kapakları
add("reels-7-pin-unuttum", 1080, 1920, "blue", frame(`
    <span class="pill" style="font-size:40px;padding:12px 30px">🔑 YENİ</span>
    <h1 class="h" style="font-size:146px;margin-top:30px">PIN'ini mi <span class="mark">unuttun?</span></h1>
    <p class="p" style="font-size:52px;margin-top:22px">E-postanı ekle, QR bilgilerin hep yanında olsun.</p>`,
  shot(S8, 520)) + brand(120));

add("reels-8-hazir-qr", 1080, 1920, "yellow", frame(`
    <span class="pill" style="font-size:40px;padding:12px 30px">📦 KAPINA GELSİN</span>
    <h1 class="h" style="font-size:146px;margin-top:30px">Yazıcıyla <span class="mark">uğraşma.</span></h1>
    <p class="p" style="font-size:52px;margin-top:22px">Su geçirmez Plaka QR sticker + PIN kartı: <b>200 TL</b>.</p>`,
  st("plaka", "74x105", null, "SAB3C9DE", "transform:rotate(-4deg)", 2.5)) + brand(120, true));

add("reels-9-sms-whatsapp", 1080, 1920, "dark", frame(`
    <span class="chip" style="font-size:40px;padding:12px 28px">💬 SMS · WHATSAPP</span>
    <h1 class="h" style="font-size:140px;margin-top:26px">Aramak istemeyen <span class="mark">mesaj atsın.</span></h1>
    <p class="p" style="font-size:50px;margin-top:20px;opacity:.92">6 hazır mesaj, tek dokunuş.</p>`,
  shot(S5, 520)) + brand(120));

add("reels-10-turist", 1080, 1920, "blue", frame(`
    <span class="pill" style="font-size:40px;padding:12px 30px">🌍 4 DİL</span>
    <h1 class="h" style="font-size:140px;margin-top:30px">Turist de <span class="mark">okutabilir.</span></h1>
    <p class="p" style="font-size:50px;margin-top:22px">Türkçe · English · العربية · Русский. Mesaj sana Türkçe gelir.</p>`,
  st("klasik", "74x105", null, "SAB3C9DE", "transform:rotate(4deg)", 2.5)) + brand(120));

add("reels-11-qr-kapat", 1080, 1920, "yellow", frame(`
    <h1 class="h" style="font-size:140px">Aracını mı <span class="mark">sattın?</span></h1>
    <p class="p" style="font-size:52px;margin-top:22px">QR'ı tek dokunuşla kapat. Kimse numarana ulaşamaz. 🔒</p>`,
  shot(S4, 520)) + brand(120, true));

add("reels-12-ilk-okutma", 1080, 1920, "dark", frame(`
    <span class="chip" style="font-size:40px;padding:12px 28px">🎉 İLK OKUTMA</span>
    <h1 class="h" style="font-size:140px;margin-top:26px">QR'ın ilk kez <span class="mark">okutuldu!</span></h1>
    <p class="p" style="font-size:50px;margin-top:20px;opacity:.92">Bildirim gelir, kaç kez okutulduğunu görürsün.</p>`,
  st("roket", "74x105", null, "SAB3C9DE", "transform:rotate(-3deg)", 2.4)) + brand(120));

// ---------------- Kaydırmalı gönderi A: Okutan kişi ne görür? (1080x1350)
add("gonderi-a1-kapak", 1080, 1350, "blue", frame(`
    <span class="pill" style="font-size:36px;padding:10px 26px">KAYDIR →</span>
    <h1 class="h" style="font-size:118px;margin-top:24px">QR'ı okutan kişi <span class="mark">ne görür?</span></h1>`,
  st("klasik", "60x90", null, "SAB3C9DE", "transform:rotate(-5deg)", 2.2), 90, 140) + brand(50));
add("gonderi-a2-ara", 1080, 1350, "yellow", frame(`
    <div style="display:flex;gap:30px;align-items:center"><span class="num">1</span><h1 class="h" style="font-size:92px">Tek dokunuşla arar</h1></div>
    <p class="p" style="font-size:42px;margin-top:20px">Numaran ekranda yazmaz. Uygulama indirmesine gerek yok.</p>`, shot(S5, 420), 90, 140) + brand(50, true));
add("gonderi-a3-mesaj", 1080, 1350, "blue", frame(`
    <div style="display:flex;gap:30px;align-items:center"><span class="num">2</span><h1 class="h" style="font-size:92px">Ya da mesaj atar</h1></div>
    <p class="p" style="font-size:42px;margin-top:20px">SMS ya da WhatsApp, hazır mesajlarla:</p>`,
  `<div class="msgs"><div><i>🚗</i>Önümü kapattınız</div><div><i>💡</i>Farlarınız açık</div><div><i>🪟</i>Camınız açık</div>
   <div><i>💥</i>Aracınıza çarpıldı</div><div><i>🚓</i>Çekici / ceza</div><div><i>⚠️</i>Araçta çocuk / hayvan</div></div>`, 90, 140) + brand(50));
add("gonderi-a4-rahatsiz", 1080, 1350, "dark", frame(`
    <div style="display:flex;gap:30px;align-items:center"><span class="num">3</span><h1 class="h" style="font-size:88px">Rahatsız Etmeyin'deysen</h1></div>
    <p class="p" style="font-size:42px;margin-top:20px">Seçtiğin saatlerde arama butonu çıkmaz, sadece mesaj.</p>`, shot(S6, 420), 90, 140) + brand(50));
add("gonderi-a5-son", 1080, 1350, "yellow", `
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;padding:80px">
    ${logo(240)}
    <h1 class="h" style="font-size:112px">Sen de QR'ını yap</h1>
    <p class="p" style="font-size:48px">Kendi tasarımını yap ya da<br>hazır Plaka QR'ı <b>200 TL</b>'ye kapına getirelim.</p>
    <span class="pill" style="font-size:42px;padding:16px 40px">Bağlantı profilde 👆</span>
  </div>`);

// ---------------- Kaydırmalı gönderi B: Camına numara yazmanın 4 riski
add("gonderi-b1-kapak", 1080, 1350, "yellow", frame(`
    <span class="pill" style="font-size:36px;padding:10px 26px">KAYDIR →</span>
    <h1 class="h" style="font-size:118px;margin-top:24px">Camına <span class="strike">numara</span> yazmanın <span class="mark">4 riski</span></h1>`,
  `<div class="card" style="font-size:96px;font-family:'Barlow Condensed';font-weight:700;transform:rotate(-4deg)">📵 0532 ••• •• ••</div>`, 90, 140) + brand(50, true));
[["gonderi-b2", "1", "Herkes kaydeder", "Otoparkta yanından geçen herkes numaranı fotoğraflayabilir."],
 ["gonderi-b3", "2", "Reklam ve dolandırıcı aramalar", "Camdaki numara kolay hedef: spam, sahte kampanya, “aracınız çekildi” tuzakları."],
 ["gonderi-b4", "3", "Gece 3'te çalar", "Ne zaman aranacağını sen seçemezsin."],
 ["gonderi-b5", "4", "Numara değişince yeniden yaz", "Kâğıt solar, yazı silinir, her seferinde baştan."]].forEach(([n, no, t, d], i) =>
  add(n, 1080, 1350, i % 2 ? "yellow" : "blue", `<div class="frame" style="top:150px;bottom:180px;justify-content:center;gap:36px">
    <span class="num" style="width:150px;height:150px;font-size:100px">${no}</span>
    <h1 class="h" style="font-size:118px">${t}</h1><p class="p" style="font-size:50px">${d}</p></div>` + brand(50, !!(i % 2))));
add("gonderi-b6-cozum", 1080, 1350, "dark", frame(`
    <span class="chip" style="font-size:36px;padding:10px 26px">✅ ÇÖZÜM</span>
    <h1 class="h" style="font-size:112px;margin-top:24px">Numara yok, <span class="mark">QR var.</span></h1>
    <p class="p" style="font-size:44px;margin-top:20px">Okutan seni arar ya da mesaj atar; numaran camda yazmaz.</p>`,
  st("plaka", "60x90", null, "SAB3C9DE", "transform:rotate(4deg)", 2.0), 90, 140) + brand(50));

// ---------------- Kaydırmalı gönderi C: Sık sorulanlar
add("gonderi-c1-kapak", 1080, 1350, "blue", frame(`
    <span class="pill" style="font-size:36px;padding:10px 26px">KAYDIR →</span>
    <h1 class="h" style="font-size:124px;margin-top:24px">En çok <span class="mark">sorulan 4 soru</span></h1>`,
  `<div style="font-size:300px;line-height:1">🤔</div>`, 90, 140) + brand(50));
[["gonderi-c2", "Numaram görünür mü?", "Camda ve QR'da yazmaz. Okutan kişi “Araç sahibini ara”ya basar, telefonu arar."],
 ["gonderi-c3", "Numaram değişirse?", "Uygulamadan PIN'inle değiştir. Sticker aynı kalır, yeniden basmana gerek yok."],
 ["gonderi-c4", "PIN'imi unutursam?", "Profilim'e e-postanı ekle. “PIN'imi unuttum” de, QR kodun ve PIN'in e-postana gelsin."],
 ["gonderi-c5", "Aracımı satarsam?", "QR'ı tek dokunuşla kapat ya da kalıcı olarak sil. Kimse numarana ulaşamaz."]].forEach(([n, q, a], i) =>

// sticker görseli kalan alana sığacak kadar büyür/küçülür (yazıya ve marka satırına binmez)
function fitAll() {
  document.querySelectorAll(".vis").forEach(v => {
    const f = v.firstElementChild; f.style.zoom = 1;
    const r = f.getBoundingClientRect(), z = Math.min(v.clientHeight * .97 / r.height, v.clientWidth * .97 / r.width, 1.35);
    f.style.zoom = z.toFixed(3);
  });
}
document.fonts.ready.then(fitAll);
