<!doctype html>
<!-- Eski adresteki (yusufbas34.github.io) web uygulamasında oluşturulan QR'ları yeni adrese (arac.bulqr.com.tr) taşır.
     Tarayıcı kayıtları adrese bağlıdır; eski adresteki liste yeni adreste görünmez. Bu sayfa eski adresle aynı kökte
     (yusufbas34.github.io deposunun index.html'i) yayınlanınca o tarayıcıdaki listeyi okuyup yeni adrese yedek kodu olarak aktarır. -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Araç QR · taşınıyor</title>
<style>body{font:17px/1.5 system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#111418;background:#eef0f3}
a.btn{display:block;text-align:center;background:#0a3a9e;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:700;margin:12px 0}</style>
</head><body>
<h1>Araç QR yeni adreste</h1>
<p id="m">Araç QR artık <b>arac.bulqr.com.tr</b> adresinde.</p>
<a class="btn" id="go" href="https://arac.bulqr.com.tr/app/">Araç QR'a git</a>
<script>
(function () {
  var tags = [], orders = [];
  try { tags = JSON.parse(localStorage.getItem("aracqr-tags") || "[]") || []; } catch (e) {}
  try { orders = JSON.parse(localStorage.getItem("aracqr-orders") || "[]") || []; } catch (e) {}
  if (!tags.length) { location.replace("https://arac.bulqr.com.tr/"); return; }
  var json = JSON.stringify({t: tags, o: orders.map(function (o) {
    return {code: o.code, token: o.token, amount: o.amount, status: o.status, tagCode: o.tagCode, design: o.design, created: o.created}; })});
  var bin = ""; new TextEncoder().encode(json).forEach(function (b) { bin += String.fromCharCode(b); });
  var code = "ARACQR1." + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  var url = "https://arac.bulqr.com.tr/app/#/yedek/" + code;
  document.getElementById("m").innerHTML = "Bu tarayıcıda <b>" + tags.length + " QR</b> bulundu. Yeni adrese taşınıyor…";
  document.getElementById("go").href = url;
  document.getElementById("go").textContent = "QR'larımı yeni adrese taşı";
  setTimeout(function () { location.replace(url); }, 1200);
})();
</script>
</body></html>
